<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow &mdash; Clean & Modern To-Do List</title>
  <meta name="description" content="A fast, clean, and intuitive to-do list web application with persistent local storage, filters, priority tagging, and inline task editing." />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background-decorations" aria-hidden="true">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <main class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </div>
        <div>
          <h1 class="app-title">TaskFlow</h1>
          <p class="app-subtitle" id="current-date">Organize your daily tasks</p>
        </div>
      </div>

      <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle light and dark theme">
        <!-- Sun icon (shown in dark mode) -->
        <svg class="theme-icon sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg class="theme-icon moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <!-- Progress Card -->
    <section class="progress-card" aria-label="Task progress summary">
      <div class="progress-info">
        <div>
          <span class="progress-label">Task Progress</span>
          <span class="progress-stats" id="progress-stats">0 of 0 completed</span>
        </div>
        <span class="progress-percent" id="progress-percent">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%"></div>
      </div>
    </section>

    <!-- Add Task Form -->
    <form id="task-form" class="task-form" autocomplete="off">
      <div class="input-wrapper">
        <input
          type="text"
          id="task-input"
          class="task-input"
          placeholder="What needs to be done?"
          maxlength="200"
          required
          aria-label="New task title"
        />
        <div class="priority-selector" title="Task Priority">
          <label for="task-priority" class="sr-only">Priority</label>
          <select id="task-priority" class="priority-dropdown" aria-label="Task priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <button type="submit" id="add-btn" class="btn btn-primary" aria-label="Add task">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Add</span>
      </button>
    </form>

    <!-- Filters & Search Toolbar -->
    <div class="toolbar">
      <div class="filter-tabs" role="tablist" aria-label="Task filters">
        <button type="button" class="tab-btn active" data-filter="all" role="tab" aria-selected="true" id="tab-all">
          All <span class="badge" id="count-all">0</span>
        </button>
        <button type="button" class="tab-btn" data-filter="active" role="tab" aria-selected="false" id="tab-active">
          Active <span class="badge" id="count-active">0</span>
        </button>
        <button type="button" class="tab-btn" data-filter="completed" role="tab" aria-selected="false" id="tab-completed">
          Done <span class="badge" id="count-completed">0</span>
        </button>
      </div>

      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search tasks..." aria-label="Search tasks" />
      </div>
    </div>

    <!-- Task List -->
    <section class="task-list-section" aria-label="Tasks list">
      <ul id="task-list" class="task-list" role="list">
        <!-- Rendered dynamically -->
      </ul>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <h2 class="empty-title">No tasks found</h2>
        <p class="empty-desc">You're all caught up! Add a new task above to get started.</p>
      </div>
    </section>

    <!-- Footer Action Bar -->
    <footer class="app-footer">
      <span class="items-left-text" id="items-left">0 pending tasks</span>
      <div class="footer-actions">
        <button type="button" id="clear-completed-btn" class="text-btn danger" title="Clear all completed tasks">
          Clear Completed
        </button>
      </div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
